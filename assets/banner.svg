<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="50%" stop-color="#121829" />
      <stop offset="100%" stop-color="#1a1528" />
    </linearGradient>

    <!-- Vibrant Gradient Accents -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="neonLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-14px) scale(1.05); }
      }
      @keyframes floatRev {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(16px) scale(0.96); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.75; }
      }
      @keyframes beamMove {
        0% { transform: translateX(-300px); }
        100% { transform: translateX(1200px); }
      }
      @keyframes rotateSlow {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -80; }
      }

      .ambient-orb-1 {
        animation: floatSlow 8s ease-in-out infinite;
        transform-origin: 300px 150px;
      }
      .ambient-orb-2 {
        animation: floatRev 10s ease-in-out infinite;
        transform-origin: 950px 220px;
      }
      .pulse-ring {
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .moving-line {
        stroke-dasharray: 20, 10;
        animation: dashAnim 6s linear infinite;
      }
      .shimmer-bar {
        animation: beamMove 5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Grid Pattern in Background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="380" />
    <line x1="200" y1="0" x2="200" y2="380" />
    <line x1="300" y1="0" x2="300" y2="380" />
    <line x1="400" y1="0" x2="400" y2="380" />
    <line x1="500" y1="0" x2="500" y2="380" />
    <line x1="600" y1="0" x2="600" y2="380" />
    <line x1="700" y1="0" x2="700" y2="380" />
    <line x1="800" y1="0" x2="800" y2="380" />
    <line x1="900" y1="0" x2="900" y2="380" />
    <line x1="1000" y1="0" x2="1000" y2="380" />
    <line x1="1100" y1="0" x2="1100" y2="380" />

    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Ambient Dynamic Lighting / Orbs (strictly background) -->
  <g opacity="0.4" filter="url(#glow)">
    <circle class="ambient-orb-1" cx="220" cy="110" r="140" fill="#4f46e5" />
    <circle class="ambient-orb-2" cx="1000" cy="240" r="160" fill="#9333ea" />
    <circle class="ambient-orb-1" cx="620" cy="330" r="100" fill="#06b6d4" />
  </g>

  <!-- Decorative Orbit Waves in background -->
  <g opacity="0.25">
    <path class="moving-line" d="M -50 260 Q 300 120 600 240 T 1250 200" fill="none" stroke="#818cf8" stroke-width="2" />
    <path class="moving-line" d="M -50 140 Q 350 300 700 150 T 1250 260" fill="none" stroke="#38bdf8" stroke-width="1.5" />
  </g>

  <!-- Subtle Border with Gradient Glow -->
  <rect x="2" y="2" width="1196" height="376" rx="14" fill="none" stroke="url(#neonLine)" stroke-width="2" class="pulse-ring" />

  <!-- Shimmering Scanline Accent -->
  <g opacity="0.6">
    <line x1="150" y1="46" x2="1050" y2="46" stroke="url(#neonLine)" stroke-width="1" />
    <line x1="150" y1="334" x2="1050" y2="334" stroke="url(#neonLine)" stroke-width="1" />
  </g>

  <!-- FOREGROUND CONTENT (Guaranteed high visibility and never obstructed) -->

  <!-- Top Category Tag -->
  <g transform="translate(600, 78)">
    <rect x="-170" y="-16" width="340" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#475569" stroke-width="1.2" />
    <circle cx="-144" cy="0" r="5" fill="#10b981" />
    <text x="-128" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="2">
      CREATOR MONETIZATION &amp; MEMBERSHIPS
    </text>
  </g>

  <!-- Main Title -->
  <text x="600" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" fill="url(#titleGrad)" filter="url(#subtleGlow)">
    Subscription-Based Social Media
  </text>
  <text x="600" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" fill="url(#titleGrad)">
    Subscription-Based Social Media
  </text>

  <!-- Subtitle -->
  <text x="600" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
    Curated SaaS Platforms, Self-Hosted Solutions &amp; Open-Source Creator Stacks
  </text>

  <!-- Feature Pills / Badges in Foreground -->
  <g transform="translate(600, 275)">
    <!-- Pill 1: SaaS Platforms -->
    <g transform="translate(-360, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e1e38" fill-opacity="0.9" stroke="#6366f1" stroke-width="1.5" />
      <text x="0" y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e0e7ff">
        💳 SaaS Platforms
      </text>
    </g>

    <!-- Pill 2: Open Source -->
    <g transform="translate(-120, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#0f2838" fill-opacity="0.9" stroke="#06b6d4" stroke-width="1.5" />
      <text x="0" y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#cffafe">
        ⚡ Open-Source Repos
      </text>
    </g>

    <!-- Pill 3: Paywalled Content -->
    <g transform="translate(130, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#2d163a" fill-opacity="0.9" stroke="#d946ef" stroke-width="1.5" />
      <text x="0" y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#fae8ff">
        🔒 Paywalled Content
      </text>
    </g>

    <!-- Pill 4: Direct Fan Support -->
    <g transform="translate(370, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#0d2e24" fill-opacity="0.9" stroke="#10b981" stroke-width="1.5" />
      <text x="0" y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#d1fae5">
        💖 Direct Fan Support
      </text>
    </g>
  </g>
</svg>
